schema_version: 1
status: draft_requires_coordinates
notes:
  - "Course numbering is fixed at 1..90."
  - "latitude/longitude remain null until measured; do not infer or synthesize coordinates."
  - "mission_ranges are entry/exit metadata only and do not define obstacle-avoidance trajectories."
  - "S_CURVE and CHILD_DUMMY avoidance is handled by perception/obstacle control, not forced waypoint geometry."

